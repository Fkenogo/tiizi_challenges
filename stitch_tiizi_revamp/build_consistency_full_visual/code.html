      </p>

<div class="absolute bottom-1/4 -left-12 w-48 h-48 bg-secondary-container/10 blur-[80px] rounded-full"></div>
</main>
<script>
    // Micro-interaction: Subtle parallax on mouse move or device orientation
    const canvas = document.querySelector('main');
    const bg = canvas.querySelector('.absolute.inset-0.z-0');

    canvas.addEventListener('mousemove', (e) => {
      const { clientX, clientY } = e;
      const xPos = (clientX / window.innerWidth - 0.5) * 20;
      const yPos = (clientY / window.innerHeight - 0.5) * 20;
      bg.style.transform = `translate(${xPos}px, ${yPos}px) scale(1.1)`;
    });

    // Reset on mouse leave
    canvas.addEventListener('mouseleave', () => {
      bg.style.transform = `translate(0, 0) scale(1.1)`;
    });
  </script>
