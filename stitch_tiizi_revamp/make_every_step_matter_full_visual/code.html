<body class="bg-background text-on-background font-body-md overflow-hidden h-screen">
<!-- Full Bleed Onboarding Screen -->
<main class="relative h-full w-full flex flex-col justify-end overflow-hidden">
<!-- Background Image Container -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuABcA1nJnmVYWnpNe4WYyIRn_5SMfFIRqsx6yIpdi__DiEbcecb2x34XawwXGRWsWpAZnOFXFW7XnQmHRp9UvNFTVmxJgwWIpk2Tq5tAKt6jWNmKPiRmcCRYflvhH2XG56tZw9FSmuTc4RqKTpDgdnHmID3hNT3TWa83eXgXuiCpde9Voz47_X7NcxzJOLwOoRE64lEKs-wT3BvkC8iiZJe9JkzzzFN7BaowLAYopmOMnXFj6GIqSs20hsWVES-rL0vh0wXplgU9J0k"/>
<!-- Dynamic Dark Gradient Overlay for Readability -->
<div class="absolute inset-0 bg-gradient-to-t from-[#000000]/95 via-[#000000]/40 to-transparent"></div>
</div>
<!-- Content Canvas -->
<div class="relative z-10 px-page-margin pb-16 pt-10 flex flex-col items-center text-center animate-fade-in-up">
<!-- Branding Accent -->
<div class="mb-8 w-12 h-1 bg-primary-container rounded-full"></div>
<!-- Heading -->
<h1 class="text-display-lg font-display-lg text-white mb-4 leading-tight">
                Make Every Step Matter
            </h1>
<!-- Subheading -->
<p class="text-body-md font-body-md text-white/90 mb-12 max-w-sm">
                Some challenges support real causes. Walk. Run. Move. Help your community while improving your own health.
            </p>
<!-- Interaction Controls -->
<div class="flex flex-col w-full gap-4 max-w-sm">
<!-- Next Button -->
<button class="h-touch-target w-full bg-primary-container text-white font-title-sm text-title-sm rounded-xl shadow-lg flex items-center justify-center transition-all active:scale-95 hover:opacity-90" onclick="this.classList.add('scale-95')">
                    Next
                </button>
<!-- Skip Intro Button -->
<button class="h-touch-target w-full text-white/70 font-title-sm text-title-sm rounded-xl flex items-center justify-center transition-colors hover:text-white hover:bg-white/10">
                    Skip intro
                </button>
</div>
<!-- Page Indicators -->
<div class="flex gap-2 mt-10">
<span class="w-8 h-1.5 rounded-full bg-primary-container"></span>
<span class="w-1.5 h-1.5 rounded-full bg-white/30"></span>
<span class="w-1.5 h-1.5 rounded-full bg-white/30"></span>
</div>
</div>
<!-- Micro-interaction Animation Layer (Subtle Particle Effect) -->
<div class="absolute inset-0 pointer-events-none opacity-30" id="particle-canvas"></div>
</main>
<script>
        // Simple micro-interaction for entry animation
        document.addEventListener('DOMContentLoaded', () => {
            const content = document.querySelector('.animate-fade-in-up');
            content.style.opacity = '0';
            content.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                content.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 300);
        });

        // Floating particles for atmospheric depth
        const particleCanvas = document.getElementById('particle-canvas');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            const size = Math.random() * 4 + 2;
            particle.style.position = 'absolute';
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.backgroundColor = 'white';
            particle.style.borderRadius = '50%';
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.opacity = Math.random() * 0.5;
            particle.style.filter = 'blur(1px)';
            
            particle.animate([
                { transform: 'translateY(0)', opacity: particle.style.opacity },
                { transform: `translateY(-${Math.random() * 100 + 50}px)`, opacity: 0 }
            ], {
                duration: Math.random() * 3000 + 3000,
                iterations: Infinity,
                delay: Math.random() * 2000
            });
            
            particleCanvas.appendChild(particle);
        }
    </script>
</body></html>
