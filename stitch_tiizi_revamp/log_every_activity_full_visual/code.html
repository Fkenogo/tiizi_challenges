<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .full-bleed-container {
            height: 100vh;
            height: 100svh;
        }
        .gradient-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 40%, rgba(0,0,0,0.2) 100%);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased font-body-md overflow-hidden">
<!-- Top App Bar (Hidden/Suppressed per rules for Onboarding screens, but keeping branding anchor logic) -->
<!-- The TopAppBar from JSON is for CHALLENGE DETAIL, we suppress it here for a focused onboarding experience. -->
<main class="relative full-bleed-container w-full overflow-hidden">
<!-- Full Bleed Background Image -->
<div class="absolute inset-0 w-full h-full">
<img alt="Fitness tracking app usage" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOaumkaFMXt9fbLl_DbyUT8k0sLGZQAliIhv5XUX1mEWOcXnKaL_vqxtc89sL1YQZSwvZy7T-mwRDIXJ0TZQIbBxHluBWEn86luB20eGyc6dsdVrxPuPRO5-glu-D8K9M7FdYMxPNwBy6XL5xsZT953qgF9XVbwyk1pFIWNCSf7oC299M3Tp4fN-kVEpSOjY1WIiC6-xONA_oM2_aKxXf8qSxS6SEVZT_0xcpWIYY6kbTCSrceUnKw7TEKg7TQLnyy0KGDJbc3Y4I7"/>
<div class="absolute inset-0 gradient-overlay"></div>
</div>
<!-- Content Shell -->
<div class="relative h-full flex flex-col justify-end px-page-margin pb-12 z-10">
<!-- Branding / Progress Indicator -->
<div class="mb-12 flex space-x-2">
<div class="h-1 w-8 bg-primary rounded-full"></div>
<div class="h-1 w-8 bg-white/30 rounded-full"></div>
<div class="h-1 w-8 bg-white/30 rounded-full"></div>
</div>
<!-- Onboarding Text -->
<div class="animate-fade-in">
<h1 class="text-display-lg font-display-lg text-white mb-4 leading-tight">
                    Log Every Activity
                </h1>
<p class="text-title-sm font-title-sm text-white/90 mb-10 max-w-md leading-relaxed">
                    Record workouts, wellness activities and healthy habits in seconds. Every activity helps you and your group make progress.
                </p>
</div>
<!-- Action Cluster -->
<div class="flex flex-col gap-4 w-full animate-fade-in" style="animation-delay: 0.2s;">
<button class="w-full h-touch-target bg-primary-container text-on-primary font-bold text-title-sm rounded-xl flex items-center justify-center transition-all active:scale-95 shadow-lg shadow-primary/20" onclick="this.classList.add('scale-95'); setTimeout(()=&gt;this.classList.remove('scale-95'), 100)">
                    Next
                </button>
<button class="w-full h-touch-target bg-transparent text-white font-semibold text-body-md rounded-xl flex items-center justify-center transition-all hover:bg-white/10 active:scale-95" onclick="this.classList.add('scale-95'); setTimeout(()=&gt;this.classList.remove('scale-95'), 100)">
                    Skip intro
                </button>
</div>
</div>
<!-- Decorative Element: Atmospheric micro-interaction -->
<div class="absolute inset-0 pointer-events-none opacity-30" id="particles"></div>
</main>
<script>
        // Simple micro-interaction for atmospheric feeling
        const particlesContainer = document.getElementById('particles');
        const particleCount = 15;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'absolute bg-white rounded-full opacity-20';
            const size = Math.random() * 4 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            
            const duration = Math.random() * 10 + 5;
            particle.animate([
                { transform: 'translateY(0) scale(1)', opacity: 0.1 },
                { transform: `translateY(-100px) scale(1.5)`, opacity: 0 },
            ], {
                duration: duration * 1000,
                iterations: Infinity,
                easing: 'ease-out'
            });
            
            particlesContainer.appendChild(particle);
        }

        // Handle Active states manually for interactions defined in JSON (simulated)
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
            btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
        });
    </script>
</body></html>
