<main class="relative h-screen w-full flex flex-col justify-end">
<!-- Background Image with DataStore Placeholder -->
<div class="absolute inset-0 z-0 h-full w-full">

<!-- Dark Overlay Gradient -->
<div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-black/20 z-10"></div>
</div>
<!-- Content Layer -->
<div class="relative z-20 px-page-margin pb-16 w-full max-w-xl mx-auto flex flex-col gap-6">
<!-- Progress Indicator -->
<div class="flex gap-2 mb-2">
<div class="h-1 w-8 rounded-full bg-surface-container-highest/30"></div>
<div class="h-1 w-12 rounded-full bg-primary-container"></div>
<div class="h-1 w-8 rounded-full bg-surface-container-highest/30"></div>
</div>
<!-- Text Content -->
<div class="flex flex-col gap-4">
<h1 class="font-display-lg text-display-lg text-white text-shadow-sm">
          Join a Community
        </h1>
<p class="font-body-md text-body-md text-white/90 leading-relaxed max-w-md">
          Everything in Tiizi begins with a group. Join friends, workplaces, schools, churches or local communities that motivate one another every day.
        </p>
</div>
<!-- Action Area -->
<div class="flex flex-col gap-stack-gap mt-4">
<button class="w-full h-touch-target bg-primary-container text-white font-bold rounded-xl active:scale-95 transition-transform flex items-center justify-center gap-2 group">
<span class="font-title-sm text-title-sm">Next</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<button class="w-full h-touch-target text-white/80 font-title-sm text-title-sm hover:text-white transition-colors">
          Skip intro
        </button>
</div>
<!-- Feature Badges (Subtle hints of what's inside) -->
<div class="flex flex-wrap gap-2 pt-4 opacity-60">
<div class="flex items-center gap-1.5 glass-effect px-3 py-1.5 rounded-full border border-white/10">
<span class="material-symbols-outlined text-[16px] text-white">group</span>
<span class="text-[10px] uppercase font-bold tracking-widest text-white">Groups</span>
</div>
<div class="flex items-center gap-1.5 glass-effect px-3 py-1.5 rounded-full border border-white/10">
<span class="material-symbols-outlined text-[16px] text-white">emoji_events</span>
<span class="text-[10px] uppercase font-bold tracking-widest text-white">Challenges</span>
</div>
<div class="flex items-center gap-1.5 glass-effect px-3 py-1.5 rounded-full border border-white/10">
<span class="material-symbols-outlined text-[16px] text-white">bolt</span>
<span class="text-[10px] uppercase font-bold tracking-widest text-white">Goals</span>
</div>
</div>
</div>
<!-- Decorative Top Bar (Static, non-functional for onboarding) -->

<div class="text-white font-black text-2xl tracking-tighter opacity-90">Tiizi.</div>
<div class="glass-effect rounded-full px-3 py-1 border border-white/10">
<span class="text-[10px] font-bold text-white uppercase tracking-tighter">Step 2 of 3</span>
</div>
</div>
</main>
<script>
    // Micro-interaction for the primary button
    const nextBtn = document.querySelector('button');
    if (nextBtn) {
        nextBtn.addEventListener('click', () => {
            // Placeholder logic for navigation
            console.log('Navigating to next onboarding step...');
        });
    }

    // Interactive hover effect for background subtly shifting
    document.addEventListener('mousemove', (e) => {
        const bg = document.querySelector('img');
        const x = (e.clientX / window.innerWidth - 0.5) * 10;
        const y = (e.clientY / window.innerHeight - 0.5) * 10;
        if(bg) {
            bg.style.transform = `scale(1.1) translate(${x}px, ${y}px)`;
        }
    });
  </script>
<style>
      /* Ensure the background image has a subtle scale to allow for the movement effect */
      img {
          transition: transform 0.2s ease-out;
          transform: scale(1.1);
      }
  </style>
