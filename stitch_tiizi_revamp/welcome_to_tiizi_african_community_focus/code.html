<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .text-label-caps { font-family: 'Plus Jakarta Sans'; font-size: 12px; line-height: 16px; letter-spacing: 0.05em; font-weight: 700; text-transform: uppercase; }
        .onboarding-gradient {
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0.85) 100%);
        }
        .active-scale:active { transform: scale(0.95); }
    </style>

<body class="bg-background text-on-background font-body-md overflow-hidden">
<!-- Full-screen Background Onboarding -->
<main class="relative h-screen w-full flex flex-col justify-end overflow-hidden">
<!-- Image Layer -->
<div class="absolute inset-0 z-0">
<img alt="Welcome to Tiizi fitness community" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAAb5Mcy4OWxUJCBaKLmDQ9VgdAFe_EdAw3KKd4Ou5LaMbZlrGO93j8AjzkyfbWbbgC0LXu5CsdHn11uUogpK5W3FMcxUB8TH3BGZxGV17sfqfClwgMyr1kVF7e2E651muNCr-AKgUO1s_LRmPjv5eS996XynIdJ9suPkON-qGBsbUDRV3Ewd1j_mjM32ThM55uFyKF2-FJp_bMnuVRkzq4lOHBnP4QpuHWndGzNICkHIWByfHoK3eCzlCj7JW-EnN8MZiDD1lCd2lQ"/>
<!-- Subtle dark gradient overlay for text legibility -->
<div class="absolute inset-0 onboarding-gradient z-10"></div>
</div>
<!-- Content Layer -->
<div class="relative z-20 px-page-margin pb-12 flex flex-col items-center text-center animate-in fade-in slide-in-from-bottom-8 duration-700">
<!-- Branding/Logo Placeholder if needed, otherwise direct into Headline -->
<div class="mb-6">
<span class="text-white font-bold text-display-lg">Tiizi</span>
</div>
<h1 class="font-display-lg text-display-lg text-white mb-4 tracking-tight">
                Welcome to Tiizi
            </h1>
<p class="font-body-md text-body-md text-white/90 mb-10 max-w-sm leading-relaxed">
                Move together. Stay accountable. Make every activity count. Join communities that turn fitness and wellness into shared journeys.
            </p>
<!-- Action Buttons -->
<div class="w-full max-w-md flex flex-col gap-4">
<button class="w-full h-touch-target bg-primary-container text-white font-title-sm text-title-sm rounded-xl active-scale transition-all hover:bg-opacity-90 shadow-lg" onclick="handleNext()">
                    Next
                </button>
<button class="w-full h-touch-target text-white font-title-sm text-title-sm rounded-xl active-scale transition-all hover:bg-white/10" onclick="handleSkip()">
                    Skip intro
                </button>
</div>
<!-- Page Indicators (Optional for onboarding flow) -->
<div class="flex gap-2 mt-8">
<div class="w-8 h-1.5 rounded-full bg-primary-container"></div>
<div class="w-2 h-1.5 rounded-full bg-white/40"></div>
<div class="w-2 h-1.5 rounded-full bg-white/40"></div>
</div>
</div>
</main>
<!-- Interactions Script -->
<script>
        function handleNext() {
            // Logic for next onboarding screen
            const mainContent = document.querySelector('main');
            mainContent.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => {
                window.location.reload(); // Simulating navigation
            }, 300);
        }

        function handleSkip() {
            // Logic for skipping onboarding
            const mainContent = document.querySelector('main');
            mainContent.classList.add('scale-110', 'opacity-0');
            setTimeout(() => {
                alert('Heading to Dashboard...');
            }, 300);
        }
        
        // Simple entry animation trigger
        document.addEventListener('DOMContentLoaded', () => {
            const content = document.querySelector('.animate-in');
            content.style.opacity = '1';
        });
    </script>
</body></html>
