<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .text-shadow-strong {
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .gradient-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md overflow-hidden">
<!-- Final Onboarding Screen -->
<main class="relative h-screen w-full flex flex-col items-center justify-end overflow-hidden">
<!-- Background Image -->
<div class="absolute inset-0 z-0">
<img alt="Background image" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB6zAuSX1D19KhaCqm6nM9t3TW___L_L0HmwT6BRyOJ0L9WmmiqT1ENQniWNfgJ10elslmcqO89zlAdHximwnTDvhYMXvh1g9bIE6hxUir_bD3c0Iou9JL9YWlQIHoJaF5BlwjvpnxJD29AaO5Jt2xNzVfDbefQ9-WOOp0EVZtJIa7cktbcz59kO3zTyK1jU70A5O-X_s5-vrgyqjbESMQwtdavb6c8uvyixAn5dbyzOr7-1FtFyUH7pIBmzJDR0NH5NC--6ZjPA7wr"/>
<div class="absolute inset-0 gradient-overlay z-10"></div>
</div>
<!-- Content Shell -->
<div class="relative z-20 w-full px-page-margin pb-24 md:pb-32 max-w-lg text-center animate-in fade-in slide-in-from-bottom-8 duration-1000 ease-out">
<!-- Success Icon / Badge -->
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary mb-8 shadow-xl border-4 border-white/10">
<span class="material-symbols-outlined !text-[32px]" style="font-variation-settings: 'FILL' 1;">emoji_events</span>
</div>
<!-- Heading -->
<h1 class="font-display-lg text-display-lg text-white mb-4 text-shadow-strong tracking-tight">
                Ready to Begin?
            </h1>
<!-- Subheading -->
<p class="font-body-md text-body-md text-white/90 mb-12 text-shadow-strong leading-relaxed max-w-sm mx-auto">
                Join your first group. Choose a challenge. Log your first activity. Let's build healthier communities together.
            </p>
<!-- Actions Container -->
<div class="space-y-4">
<button class="group relative w-full h-touch-target bg-primary-container hover:bg-primary text-white font-title-sm text-title-sm rounded-xl transition-all duration-300 transform active:scale-95 shadow-2xl flex items-center justify-center gap-2 overflow-hidden" onclick="handleGetStarted()">
<span class="relative z-10">Get Started</span>
<span class="material-symbols-outlined relative z-10 group-hover:translate-x-1 transition-transform">arrow_forward</span>
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<button class="w-full py-3 text-white/70 font-label-caps text-label-caps hover:text-white transition-colors">
                    SKIP FOR NOW
                </button>
</div>
</div>
<!-- Progress Indicator (Atmospheric) -->
<div class="absolute bottom-8 z-20 flex gap-2">
<div class="w-2 h-2 rounded-full bg-white/20"></div>
<div class="w-2 h-2 rounded-full bg-white/20"></div>
<div class="w-8 h-2 rounded-full bg-primary-container"></div>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        function handleGetStarted() {
            const btn = event.currentTarget;
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            `;
            setTimeout(() => {
                alert("Welcome to the community! Let's start building your profile.");
                location.reload();
            }, 800);
        }

        // Add subtle parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
            const img = document.querySelector('img');
            if(img) img.style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body></html>
