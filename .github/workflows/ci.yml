# Minimal validation: the API package must never be invisible to CI.
# Frontend (web) and Cloud Functions keep their existing build/typecheck gates.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api-image:
    name: api image (build, liveness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f api/Dockerfile -t tiizi-api:ci ./api
      - name: Start container without production credentials
        run: |
          docker run -d --name tiizi-api-ci -p 8080:8080 \
            -e PORT=8080 \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci \
            -e FIREBASE_PROJECT_ID=ci-project \
            tiizi-api:ci
          sleep 5
          docker logs tiizi-api-ci
      - name: Liveness check (/health needs no DB or credentials)
        run: curl -fsS http://127.0.0.1:8080/health
      - name: Readiness detects the unreachable database (/ready is 503, never 401)
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ready)" = "503"
      - name: Stop container
        if: always()
        run: docker rm -f tiizi-api-ci

  web:
    name: web (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Root typecheck covers scripts/ which import functions/src; those
      # imports resolve against functions/node_modules.
      - run: npm ci
        working-directory: functions
      - run: npm run build

  functions:
    name: functions (build, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
