# Minimal validation: the API package must never be invisible to CI.
# Frontend (web) and Cloud Functions keep their existing build/typecheck gates.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: web (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Root typecheck covers scripts/ which import functions/src; those
      # imports resolve against functions/node_modules.
      - run: npm ci
        working-directory: functions
      - run: npm run build

  functions:
    name: functions (build, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
