# Minimal validation: the API package must never be invisible to CI.
# Frontend (web) and Cloud Functions keep their existing build/typecheck gates.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api-image:
    name: api image (build, liveness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f api/Dockerfile -t tiizi-api:ci ./api
      - name: Start container without production credentials
        run: |
          docker run -d --name tiizi-api-ci -p 8080:8080 \
            -e PORT=8080 \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci \
            -e FIREBASE_PROJECT_ID=ci-project \
            tiizi-api:ci
          sleep 5
          docker logs tiizi-api-ci
      - name: Liveness check (/health needs no DB or credentials)
        run: curl -fsS http://127.0.0.1:8080/health
      - name: Readiness detects the unreachable database (/ready is 503, never 401)
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ready)" = "503"
      - name: Stop container
        if: always()
        run: docker rm -f tiizi-api-ci

  web:
    name: web (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            functions/package-lock.json
      - run: npm ci
      # Root typecheck covers scripts/ which import functions/src and
      # api/src; those imports resolve against functions/node_modules and
      # api/node_modules, so both packages must be installed before build.
      - run: npm ci
        working-directory: functions
      - run: npm ci
        working-directory: api
      - run: npm run build

  functions:
    name: functions (build, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  # Permanent active-runtime boundary gate. Proves the repository engineering
  # rules in AGENTS.md: archived Product V1 is not reachable from the V2
  # runtime, the active API exposes no /v1 route, no active V2 API client
  # targets /v1, and no V2 runtime emits an /app/* browser route. The
  # regression fixture proves each check actually fails when a prohibited
  # dependency, route, or client target is introduced.
  #
  # This job closes the detection gap where a partial API namespace migration
  # could previously pass CI (only /health and /ready were exercised).
  boundary:
    name: boundary (V1 exclusion + API namespace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Boundary guard (AGENTS.md sections 1-3)
        run: npm run test:boundary
      - name: Boundary guard regression fixture (proves the guard fails)
        run: npm run test:boundary-regression
      - name: Existing V2 experience boundary guard
        run: npm run test:v2-experience-boundary
      - name: Existing V2 runtime boundary guard
        run: npm run test:v2-runtime-boundary
      - name: S5b Today experience guards
        run: npm run test:s5b-today

  # API contract verification through the canonical /api namespace. Proves
  # representative authenticated READ and WRITE operations work on /api and
  # that the retired /v1 namespace is not an active API contract.
  api-contract:
    name: api contract (/api namespace)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx vitest run test/apiNamespaceContract.test.ts
